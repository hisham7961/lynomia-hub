# ─────────────────────────────────────────────────────────────────────────────
# إعدادُ بوّابة LiteLLM — المرحلة ١٫٥
#
# **فارغٌ من النماذجِ عمداً.** المرحلةُ ١٫٥ تُثبت أنّ البوّابةَ تعمل ويصلها
# Hub — **ولا تربط مزوّداً ولا تولّد حرفاً**. فـ`model_list` فارغةٌ الآن،
# و`/v1/models` يردّ قائمةً فارغة: بوّابةٌ حيّةٌ بلا مزوّد — وهي حالةٌ مشروعةٌ
# يقولها مركزُ Hub صراحةً («نماذجُ مُعلَنة: 0»).
#
# ولا سرَّ في هذا الملف: يُركَّب **للقراءةِ فقط** (`:ro`) وهو في المستودع.
# ─────────────────────────────────────────────────────────────────────────────

model_list: []

general_settings:
  # حفظُ النماذجِ في القاعدةِ — يُهيّئ المرحلةَ ٢ (إدارةُ المزوّدين من الواجهة)
  # ولا يفعل شيئاً الآن إذ لا نموذجَ ولا اعتماد.
  store_model_in_db: true

litellm_settings:
  # لا تُسقِط الطلبَ لأجلِ وسيطٍ لا يدعمه مزوّدٌ بعينِه
  drop_params: true
  # سجلٌّ نظيفٌ للإنتاج — لا تنقيحَ مُسهِب
  set_verbose: false
