; ── سقفُ الرفع على الخادم (PHP-FPM / CGI) ──
;
; إعدادُ النظام «أقصى حجم للملف المرفوع» لا يرفع سقفَ الخادم: PHP يقطع الطلبَ
; قبل أن يصل إلى التطبيق أصلاً حين يتجاوز `upload_max_filesize` أو
; `post_max_size` — فيرى المستخدم صفحةً بيضاء بعد رفع نصف غيغابايت.
;
; هذا الملف يُقرأ تلقائياً على أغلب الاستضافات المشتركة (PHP-FPM/FastCGI)،
; ويُطبَّق خلال دقائق (‏user_ini.cache_ttl الافتراضي ٣٠٠ ثانية).
; إن كان الخادم mod_php فهذا الملفُ لا يُقرأ — ارفع القيمَ حينها من php.ini
; أو من لوحة الاستضافة. ولا تُعِد `php_value` إلى `.htaccess`: تُسقط الموقعَ
; كلَّه بـ500 حيث لا يشملها AllowOverride (وهو ما حدث فعلاً)، والحارسُ
; HtaccessSafetyTest يمنع عودتَها.
;
; post_max_size أكبرُ قليلاً من upload_max_filesize: الطلبُ يحمل حقولَ
; النموذج وحدودَ multipart فوق الملف نفسه.

upload_max_filesize = 1024M
post_max_size = 1056M

; رفعُ غيغابايتٍ على وصلةٍ بطيئة يتجاوز الدقيقتين بسهولة
max_execution_time = 600
max_input_time = 600

; الرفعُ يُكتب على القرص مباشرةً فلا يستهلك الذاكرة — والقيمة هنا لبقيّة الطلب
memory_limit = 512M
